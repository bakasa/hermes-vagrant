[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ─── Main Agent (OWL) — Slack gateway, user-facing ───────────────────────────
; Binds Railway-injected $PORT so health checks pass. Falls back to 3000 locally.
[program:hermes-main]
command=/bin/sh -c 'exec hermes gateway --config config.yaml --port "${PORT:-3000}"'
directory=/app/agents/main
user=hermes
autostart=true
autorestart=true
startretries=5
startsecs=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/data",HERMES_HOME="/data/.hermes/main",AGENT_NAME="main",AGENT_ROLE="Main Coordinator (OWL)"

