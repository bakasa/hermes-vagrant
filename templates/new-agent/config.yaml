agent:
  name: {{AGENT_NAME}}
  role: "{{AGENT_ROLE}}"
  soul: "./SOUL.md"

model:
  provider: "openrouter"
  default: "openrouter/auto"

gateway:
  port: {{AGENT_PORT}}
  bind: "0.0.0.0"

paths:
  skills: "./skills/"
  cron: "./cron/"
  memories: "/data/.hermes/memories/"

logging:
  level: "info"
