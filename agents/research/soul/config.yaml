agent:
  name: "research"
  role: "Research Agent"
  port: 3001

gateway:
  port: 3001
  bind: "0.0.0.0"
  workers: 4

model:
  provider: "openrouter"
  default: "anthropic/claude-sonnet-4-20250513"
  fallback: "openrouter/auto"

paths:
  soul: "/home/hermes/.hermes/SOUL.md"
  skills: "/home/hermes/.hermes/skills/"
  cron: "/home/hermes/.hermes/cron/"
  memories: "/home/hermes/.hermes/memories/"
  handoffs: "/data/handoffs/"
  logs: "/home/hermes/.hermes/logs/"

logging:
  level: "info"
  file: "/home/hermes/.hermes/logs/hermes.log"

security:
  tirith_enabled: false
  approvals_mode: "off"

crew:
  name: "hermes-research"
  vm_ip: "192.168.56.11"
