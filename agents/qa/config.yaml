# Hermes QA Agent Configuration

app:
  name: hermes-qa
  description: "QA Agent — quality gatekeeper for PR reviews, test runs, and security scans"
  version: "1.0.0"

server:
  port: 3004
  host: "0.0.0.0"

provider:
  type: openrouter
  base_url: "https://openrouter.ai/api/v1"
  model: "anthropic/claude-3-opus"   # Thorough reviews demand a strong model

gateway:
  port: 3004
  health_check_path: "/health"

review:
  auto_run_tests: true
  security_scan: true
  max_pr_size_lines: 500       # Flag PRs that are too large for effective review
  max_review_time_seconds: 300  # Target: review within 5 minutes

logging:
  level: "info"
  format: "text"
