# Hermes Main Agent (OWL) — Configuration
# Profile: main
# Port: 3000

openrouter:
  api_key: "${OPENROUTER_API_KEY}"

agent:
  name: "owl"
  role: "main"
  model: "openrouter/owl-alpha"
  port: 3000

providers:
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    model: "openrouter/owl-alpha"
    api_key: "${OPENROUTER_API_KEY}"

gateway:
  host: "0.0.0.0"
  port: 3000
  mode: "slack"

slack:
  bot_token: "${SLACK_BOT_TOKEN}"
  app_token: "${SLACK_APP_TOKEN}"
  signing_secret: "${SLACK_SIGNING_SECRET}"

handoff:
  incoming_dir: "/data/handoffs/incoming"
  outgoing_dir: "/data/handoffs/outgoing"
  completed_dir: "/data/handoffs/completed"
  failed_dir: "/data/handoffs/failed"

agents:
  coder:
    name: "hermes-coder"
    handoff_dir: "/data/hermes-coder/handoffs"
  research:
    name: "hermes-research"
    handoff_dir: "/data/hermes-research/handoffs"
  crew:
    name: "hermes-crew"
    handoff_dir: "/data/hermes-crew/handoffs"
  subconscious:
    name: "hermes-subconscious"
    handoff_dir: "/data/hermes-subconscious/handoffs"

logging:
  level: "INFO"
  file: "/data/.hermes/logs/main-agent.log"
  max_size_mb: 50
  backup_count: 5
